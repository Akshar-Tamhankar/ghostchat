<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0e0e10" />
  <title>ghostchat</title>
  <link rel="stylesheet" href="/app.css?v=15" />
  <script src="/socket.io/socket.io.js"></script>
  <script defer src="/app.js?v=15"></script>
</head>
<body>
<div id="app">

  <!-- LOBBY -->
  <div id="lobby">
    <div class="logo">
      <h1>ghost<span>chat</span></h1>
      <p>private · just for two · end-to-end encrypted</p>
    </div>
    <div class="lobby-card">
      <div class="field">
        <label>your name</label>
        <input id="username" type="text" placeholder="your name" maxlength="20" autocomplete="off" autocapitalize="off" />
      </div>
      <div class="field">
        <label>password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="btn" id="enter-btn">enter →</button>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div class="conn-banner" id="conn-banner">reconnecting…</div>
    <div class="chat-header">
      <div class="dot" id="conn-dot"></div>
      <div class="room-info">
        <div class="room-name">#ghostchat</div>
        <div class="room-id" id="header-user"></div>
      </div>
      <button class="hdr-icon" id="voice-btn" title="voice call" aria-label="voice call">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="hdr-icon" id="video-btn" title="video call" aria-label="video call">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
      <button class="hdr-btn" id="leave-btn">leave</button>
    </div>
    <div class="online-bar" id="online-bar">no one else online</div>
    <div class="messages" id="messages"></div>
    <div class="typing-bar" id="typing-bar">
      <span id="typing-who"></span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>
    <div class="reply-preview" id="reply-preview">
      <div class="rp-body"><div class="rp-name" id="rp-name"></div><div class="rp-text" id="rp-text"></div></div>
      <button class="rp-close" id="rp-close" aria-label="cancel reply">×</button>
    </div>
    <div class="chat-input-area">
      <button class="attach-btn" id="attach-btn" title="send photo" aria-label="send photo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input type="file" id="file-input" accept="image/*" multiple hidden />
      <textarea id="msg-input" rows="1" placeholder="type a message…"></textarea>
      <button class="send-btn" id="send-btn" aria-label="send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- INCOMING CALL -->
  <div id="incoming-call" class="modal">
    <div class="modal-card">
      <div class="ic-kind" id="ic-kind">incoming call</div>
      <div class="ic-name" id="ic-name"></div>
      <div class="ic-actions">
        <button class="ic-btn decline" id="ic-decline">decline</button>
        <button class="ic-btn accept" id="ic-accept">accept</button>
      </div>
    </div>
  </div>

  <!-- CALL OVERLAY -->
  <div id="call-overlay">
    <div class="call-status" id="call-status">calling…</div>
    <video id="remote-video" autoplay playsinline></video>
    <div class="audio-only" id="audio-only">
      <div class="avatar"></div>
      <div class="call-peer" id="call-peer"></div>
    </div>
    <video id="local-video" autoplay playsinline muted></video>
    <div class="call-controls">
      <button class="call-ctrl" id="min-btn" title="minimize (keep texting)">▾</button>
      <button class="call-ctrl off" id="mute-btn" title="microphone">🔇</button>
      <button class="call-ctrl off" id="cam-btn" title="camera">🚫</button>
      <button class="call-ctrl" id="screen-btn" title="share screen">🖥️</button>
      <button class="call-ctrl hangup" id="hangup-btn" title="hang up">✕</button>
    </div>
    <button id="mini-hangup" title="hang up">✕</button>
    <div id="mini-hint">drag to move · tap to expand</div>
  </div>

  <!-- FULLSCREEN IMAGE VIEWER -->
  <div id="image-viewer"><img id="viewer-img" alt="shared photo" /></div>

</div>
</body>
</html>
